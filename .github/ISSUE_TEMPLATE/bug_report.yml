name: Bug report
description: Report a problem with the Bitrise Desktop App
labels: ["bug"]
body:
  - type: input
    id: app-version
    attributes:
      label: App version
      description: Find it in Settings > About.
      placeholder: e.g. 1.0.0
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS version
      placeholder: e.g. 14.6
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect to happen, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce it?
  - type: textarea
    id: extra
    attributes:
      label: Logs or screenshots
      description: Optional. Paste any relevant output or drag in a screenshot.
